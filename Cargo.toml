[package]
name = "dbgcmd"
version = "0.4.0"
authors = ["Vi <violet@hey.com>"]
edition = "2024"
description = """
This is a simple library for implementing command-line-style debug consoles within an application.

It doesn't handle rendering, or the logic of any individual commands. All it does is model the state of the console.
"""
repository = "https://github.com/mistodon/dbgcmd"
readme = "README.md"
keywords = ["debug", "console"]
categories = ["games", "game-development", "gui", "command-line-interface"]
license = "CC0-1.0"

[package.metadata.docs.rs]
features = ["winit"]

[features]
default = []
force-enabled = []
winit = ["winit_0_30"]
winit_0_21 = ["dep:winit_0_21"]
winit_0_24 = ["dep:winit_0_24"]
winit_0_27 = ["dep:winit_0_27"]
winit_0_29 = ["dep:winit_0_29"]
winit_0_30 = ["dep:winit_0_30"]

[dependencies]
itertools = "0.8"

[dependencies.winit_0_21]
package = "winit"
version = ">= 0.21, < 0.24"
optional = true

[dependencies.winit_0_24]
package = "winit"
version = ">= 0.24, < 0.27"
optional = true

[dependencies.winit_0_27]
package = "winit"
version = ">= 0.27, < 0.29"
optional = true

[dependencies.winit_0_29]
package = "winit"
version = ">= 0.29, < 0.30"
optional = true

[dependencies.winit_0_30]
package = "winit"
version = ">= 0.30"
optional = true
